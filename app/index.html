<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MK Studio · Minha agenda</title>
<meta name="theme-color" content="#19130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MK Agenda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ee; --ink:#19130f; --soft:#6f645b; --sand:#efe6da; --cacao:#5a4232;
    --line:#e3dbd1; --panel:#fff; --ok:#2f7a4f; --ok-bg:#e6f2ea; --no:#a2412f; --no-bg:#f7e6e1;
    --warn:#8a6418; --warn-bg:#fbf1dc;
    --r:18px;
    font-family:"Jost","Futura","Century Gothic",system-ui,sans-serif;
    color:var(--ink); background:var(--bg);
    -webkit-tap-highlight-color:transparent;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg)}
  body{font-weight:400;font-size:16px;line-height:1.35;padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input{font:inherit}
  .hidden{display:none!important}
  .serif{font-family:"Cormorant Garamond",Georgia,serif}

  /* ---------- login ---------- */
  #login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 28px;
    background:radial-gradient(120% 80% at 50% 0%, #3a2a20 0%, #19130f 70%);color:#f2ece4}
  #login .logo{font-size:44px;letter-spacing:.06em;margin:0}
  #login .sub{color:#c9a98c;letter-spacing:.28em;text-transform:uppercase;font-size:12px;margin:6px 0 44px}
  #login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
  #login label{font-size:14px;color:#b9ada1}
  #login input{width:100%;padding:16px 18px;border-radius:14px;border:1px solid #4a3b31;background:#221c18;color:#f2ece4;font-size:18px;letter-spacing:.04em}
  #login input:focus{outline:2px solid #c9a98c;outline-offset:1px}
  .btn-main{padding:16px;border-radius:14px;background:#c9a98c;color:#19130f;font-weight:600;font-size:17px}
  .btn-main:disabled{opacity:.6}
  #loginErro{color:#f0a493;font-size:14px;min-height:20px;text-align:center}

  /* ---------- topo (ganhos) ---------- */
  header{position:sticky;top:0;z-index:5;background:var(--ink);color:#f2ece4;
    padding:calc(env(safe-area-inset-top) + 14px) 20px 18px;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(25,19,15,.18)}
  .topline{display:flex;justify-content:space-between;align-items:center}
  .hello{font-size:15px;color:#b9ada1}
  .hello b{color:#f2ece4;font-weight:500}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#2a221d;color:#e8dccd}
  .icon-btn svg{width:18px;height:18px}
  .icon-btn.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .earn{margin-top:14px;text-align:center}
  .earn .lbl{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c9a98c}
  .earn .val{font-size:46px;font-weight:500;letter-spacing:-.01em;margin:2px 0 2px;font-variant-numeric:tabular-nums}
  .earn .val small{font-size:22px;font-weight:400;margin-right:4px;color:#d8c7b4}
  .earn .val.pop{animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.08);color:#9fe0b4}100%{transform:scale(1)}}
  .earn .meta{font-size:14px;color:#b9ada1}
  .earn .meta b{color:#f2ece4;font-weight:500}

  /* ---------- dias ---------- */
  .days{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;width:58px;padding:9px 0 8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);
    text-align:center;scroll-snap-align:center;position:relative}
  .day .dw{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
  .day .dn{font-size:21px;font-weight:500;margin-top:1px}
  .day .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%}
  .day .dot.pend{background:#d08a2c}
  .day .dot.folga{background:#b0a497}
  .day.sel{background:var(--cacao);border-color:var(--cacao);color:#fff}
  .day.sel .dw{color:#e8d6c4}
  .day.off{opacity:.55}

  main{padding:6px 16px 40px}
  .dayhead{display:flex;align-items:baseline;justify-content:space-between;margin:12px 4px 10px}
  .dayhead h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:26px;margin:0}
  .dayhead span{font-size:14px;color:var(--soft)}

  .banner{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;font-size:15px;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .banner.folga{background:var(--sand);color:var(--cacao)}
  .banner.pend{background:var(--warn-bg);color:var(--warn)}
  .banner button{font-weight:600;text-decoration:underline;white-space:nowrap}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(25,19,15,.04)}
  .card.feito{border-color:#bfdccb}
  .card.nao{background:#fbf8f5}
  .card.nao .cli,.card.nao .serv{color:var(--soft)}
  .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .hora{font-weight:600;font-size:15px;color:var(--cacao);letter-spacing:.02em}
  .cli{font-size:19px;font-weight:500;margin-top:2px}
  .serv{font-size:15px;color:var(--soft);margin-top:3px}
  .obs{font-size:14px;color:var(--soft);margin-top:6px;font-style:italic}
  .tel{font-size:14px;color:var(--cacao);text-decoration:none;display:inline-block;margin-top:6px}
  .gain{text-align:right;white-space:nowrap}
  .gain .g{font-size:18px;font-weight:600}
  .gain .c{font-size:12px;color:var(--soft)}
  .actions{display:flex;gap:10px;margin-top:14px}
  .actions button{flex:1;padding:13px 10px;border-radius:13px;font-weight:600;font-size:15px}
  .b-ok{background:var(--ok);color:#fff}
  .b-no{background:var(--no-bg);color:var(--no)}
  .b-ok:disabled,.b-no:disabled{opacity:.5}
  .state{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .pill{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.no{background:var(--no-bg);color:var(--no)}
  .undo{font-size:14px;color:var(--soft);text-decoration:underline}
  .future{margin-top:10px;font-size:13px;color:var(--soft)}
  .future button{color:var(--no);text-decoration:underline;font-size:13px}

  .empty{text-align:center;color:var(--soft);padding:34px 10px 18px;font-size:15px}
  .folga-btn{display:block;width:100%;margin-top:8px;padding:14px;border-radius:14px;border:1.5px dashed #cbbfb2;color:var(--cacao);font-weight:500}

  /* ---------- folha (bottom sheet) ---------- */
  .scrim{position:fixed;inset:0;background:rgba(25,19,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  @keyframes fade{from{opacity:0}}
  .sheet{width:100%;max-width:520px;background:var(--panel);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .sheet h3{margin:0 0 4px;font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600}
  .sheet p{margin:6px 0 14px;color:var(--soft);font-size:15px}
  .sheet .field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:8px 0 6px}
  .sheet .field span{color:var(--soft)}
  .sheet .field input{border:0;outline:0;flex:1;font-size:24px;padding:10px 0;background:transparent;font-variant-numeric:tabular-nums}
  .sheet .you{font-size:16px;margin:8px 0 18px}
  .sheet .you b{color:var(--ok);font-size:20px}
  .sheet .btns{display:flex;gap:10px}
  .sheet .btns button{flex:1;padding:15px;border-radius:14px;font-weight:600;font-size:16px}
  .b-ghost{background:var(--sand);color:var(--cacao)}
  .b-dark{background:var(--ink);color:#fff}
  .b-red{background:var(--no);color:#fff}

  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:30;
    background:#1f6b43;color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:17px;box-shadow:0 10px 30px rgba(0,0,0,.25);
    animation:toast 2.4s ease forwards;white-space:nowrap}
  .toast.err{background:var(--no);font-size:15px;white-space:normal;width:max-content;max-width:90vw;text-align:center}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
  .demo{background:#fbf1dc;color:#8a6418;font-size:13px;text-align:center;padding:6px}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<section id="login" class="hidden">
  <h1 class="logo serif">MK Studio</h1>
  <div class="sub">Minha agenda</div>
  <form id="loginForm" autocomplete="off">
    <label for="codigo">Código de acesso</label>
    <input id="codigo" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Digite seu código">
    <button class="btn-main" id="btnEntrar" type="submit">Entrar</button>
    <div id="loginErro"></div>
  </form>
</section>

<!-- ========== APP ========== -->
<section id="app" class="hidden">
  <div id="demoBar" class="demo hidden">Modo demonstração — dados de exemplo</div>
  <header>
    <div class="topline">
      <div class="hello">Olá, <b id="nome">—</b></div>
      <div style="display:flex;gap:8px">
        <button class="icon-btn" id="btnAtualizar" aria-label="Atualizar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="btnSair" aria-label="Sair">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>
    <div class="earn">
      <div class="lbl">Ganhos da semana</div>
      <div class="val" id="ganhoSemana"><small>R$</small>0,00</div>
      <div class="meta" id="ganhoMeta">Hoje: <b>R$ 0,00</b></div>
    </div>
  </header>

  <nav class="days" id="dias"></nav>
  <main id="lista"></main>
</section>

<div id="overlay"></div>

<script>
/* =================== CONFIGURAÇÃO =================== */
// Cole aqui o URL do App da Web do Apps Script do app (termina em /exec).
const API_URL = 'https://script.google.com/macros/s/AKfycbwFxURRUtcd7qOTbkl6zv1oW3STFAlPX7SU0AyHt6vLe_TTE_1afrXOKW4m_M61F9BP/exec';
/* ==================================================== */

const DEMO = !/^https:\/\/script\.google\.com\//.test(API_URL);
const LS_KEY = 'mk-app-codigo';
const DIAS_SEM = ['dom','seg','ter','qua','qui','sex','sáb'];
const DIAS_SEM_LONGO = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

let codigo = lerCodigo();
let dados = null;
let diaSel = null;
let ganhoMostrado = 0;
let ocupado = false;

const $ = s => document.querySelector(s);
const reais = n => (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hm = h => { const [a, b] = String(h || '').split(':'); return a ? (b && b !== '00' ? `${a}h${b}` : `${a}h`) : ''; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = iso => new Date(iso + 'T12:00:00Z').getUTCDay();

function lerCodigo() { try { return localStorage.getItem(LS_KEY) || ''; } catch (e) { return ''; } }
function salvarCodigo(c) { try { c ? localStorage.setItem(LS_KEY, c) : localStorage.removeItem(LS_KEY); } catch (e) {} }

/* ---------------- comunicação ---------------- */
async function api(acao, extra = {}) {
  if (DEMO) return demoApi(acao, extra);
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 25000);
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao, codigo, ...extra }),
      signal: ctrl.signal
    });
    return await r.json();
  } catch (e) {
    return { ok: false, erro: 'Sem conexão. Confira a internet e tente de novo.' };
  } finally { clearTimeout(t); }
}

/* ---------------- login ---------------- */
$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const c = $('#codigo').value.trim();
  if (!c) return;
  $('#btnEntrar').disabled = true; $('#btnEntrar').textContent = 'Entrando…'; $('#loginErro').textContent = '';
  codigo = c;
  const r = await api('login');
  $('#btnEntrar').disabled = false; $('#btnEntrar').textContent = 'Entrar';
  if (!r.ok) { $('#loginErro').textContent = r.erro || 'Não foi possível entrar.'; codigo = ''; return; }
  salvarCodigo(c);
  mostrarApp();
});

$('#btnSair').addEventListener('click', () => {
  abrirFolha(`<h3>Sair do app?</h3><p>Você vai precisar digitar seu código de novo para entrar.</p>
    <div class="btns"><button class="b-ghost" data-x>Cancelar</button><button class="b-dark" id="okSair">Sair</button></div>`);
  $('#okSair').onclick = () => { salvarCodigo(''); codigo = ''; dados = null; fecharFolha(); mostrarLogin(); };
});

function mostrarLogin() {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#codigo').value = ''; setTimeout(() => $('#codigo').focus(), 50);
}
function mostrarApp() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#demoBar').classList.toggle('hidden', !DEMO);
  carregar();
}

/* ---------------- carregar ---------------- */
async function carregar(silencioso) {
  if (ocupado) return;
  const b = $('#btnAtualizar'); b.classList.add('spin');
  const r = await api('dados');
  b.classList.remove('spin');
  if (!r.ok) {
    if (/código/i.test(r.erro || '')) { salvarCodigo(''); mostrarLogin(); }
    if (!silencioso) toast(r.erro || 'Erro ao carregar.', true);
    return;
  }
  aplicar(r, false);
}
$('#btnAtualizar').addEventListener('click', () => carregar());
document.addEventListener('visibilitychange', () => { if (!document.hidden && codigo && dados) carregar(true); });
setInterval(() => { if (!document.hidden && codigo && dados) carregar(true); }, 120000);

function aplicar(r, animar) {
  dados = r;
  if (!diaSel || diaSel < r.inicioSemana) diaSel = r.hoje;
  $('#nome').textContent = r.profissional.nome;
  atualizarGanhos(animar);
  desenharDias();
  desenharLista();
}

/* ---------------- ganhos (contador) ---------------- */
function atualizarGanhos(animar) {
  const alvo = dados.ganhosSemana || 0;
  const el = $('#ganhoSemana');
  const de = ganhoMostrado;
  ganhoMostrado = alvo;
  const pinta = v => { el.innerHTML = `<small>R$</small>${reais(v)}`; };
  if (animar && alvo !== de) {
    const t0 = performance.now(), dur = 900;
    const passo = t => {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      pinta(de + (alvo - de) * e);
      if (p < 1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
    if (alvo > de) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  } else pinta(alvo);
  const n = dados.feitosSemana || 0;
  $('#ganhoMeta').innerHTML = `Hoje: <b>R$ ${reais(dados.ganhosHoje)}</b> · ${n} ${n === 1 ? 'atendimento feito' : 'atendimentos feitos'}`;
}

/* ---------------- dias ---------------- */
function folgaDo(dia) { return dados.folgas.find(f => f.data === dia); }
function atendDo(dia) { return dados.atendimentos.filter(a => a.data === dia); }
function pendentes(dia) { return atendDo(dia).filter(a => !a.execucao && dia <= dados.hoje); }

function desenharDias() {
  const abertos = new Set(dados.diasAbertos);
  const fim = somaDias(dados.hoje, 20);
  let html = '';
  for (let d = dados.inicioSemana; d <= fim; d = somaDias(d, 1)) {
    const temAtend = atendDo(d).length > 0;
    if (!abertos.has(dow(d)) && !temAtend) continue;
    const [, m, dd] = d.split('-');
    const pend = pendentes(d).length > 0;
    const folga = folgaDo(d);
    const passado = d < dados.hoje;
    html += `<button class="day ${d === diaSel ? 'sel' : ''} ${passado && !pend ? 'off' : ''}" data-dia="${d}">
      ${pend ? '<span class="dot pend"></span>' : folga ? '<span class="dot folga"></span>' : ''}
      <div class="dw">${d === dados.hoje ? 'hoje' : DIAS_SEM[dow(d)]}</div>
      <div class="dn">${Number(dd)}</div></button>`;
  }
  const nav = $('#dias');
  nav.innerHTML = html;
  nav.querySelectorAll('.day').forEach(b => b.onclick = () => { diaSel = b.dataset.dia; desenharDias(); desenharLista(); });
  const sel = nav.querySelector('.sel');
  if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest' });
}

/* ---------------- lista do dia ---------------- */
function desenharLista() {
  const d = diaSel;
  const [, m, dd] = d.split('-');
  const lista = atendDo(d);
  const folga = folgaDo(d);
  const futuroOuHoje = d >= dados.hoje;
  const diaGanho = lista.filter(a => a.execucao === 'feito').reduce((s, a) => s + a.ganho, 0);

  let html = `<div class="dayhead"><h2>${d === dados.hoje ? 'Hoje' : DIAS_SEM_LONGO[dow(d)]}, ${Number(dd)} ${MESES[Number(m) - 1]}</h2>
    <span>${lista.length ? `${lista.length} ${lista.length === 1 ? 'cliente' : 'clientes'}` : ''}${diaGanho ? ` · R$ ${reais(diaGanho)}` : ''}</span></div>`;

  // aviso de pendências em outros dias
  const outrosPend = dados.atendimentos.filter(a => !a.execucao && a.data < dados.hoje && a.data !== d);
  if (outrosPend.length) {
    const dia1 = outrosPend[0].data;
    html += `<div class="banner pend"><span>${outrosPend.length} ${outrosPend.length === 1 ? 'atendimento' : 'atendimentos'} de dias anteriores sem marcar</span>
      <button data-ir="${dia1}">Ver</button></div>`;
  }

  if (folga) {
    html += `<div class="banner folga"><span>${folga.salaoFechado ? 'Salão fechado neste dia' : 'Você está de folga neste dia'}</span>
      ${!folga.salaoFechado && futuroOuHoje ? '<button id="tirarFolga">Remover folga</button>' : ''}</div>`;
  }

  if (!lista.length) {
    html += `<div class="empty">${folga ? 'Nenhum atendimento.' : 'Nenhum atendimento marcado para este dia.'}</div>`;
  }

  lista.forEach(a => {
    const cls = a.execucao === 'feito' ? 'feito' : a.execucao === 'nao_feito' ? 'nao' : '';
    const telLimpo = String(a.telefone).replace(/\D/g, '');
    html += `<div class="card ${cls}">
      <div class="row1">
        <div>
          <div class="hora">${hm(a.horario)}${a.fim ? ' – ' + hm(a.fim) : ''}</div>
          <div class="cli">${esc(a.cliente) || 'Cliente'}</div>
          <div class="serv">${esc(a.servico)}</div>
          ${a.obs ? `<div class="obs">“${esc(a.obs)}”</div>` : ''}
          ${telLimpo && a.execucao !== 'nao_feito' ? `<a class="tel" href="https://wa.me/55${telLimpo}" target="_blank" rel="noopener">WhatsApp ${esc(a.telefone)}</a>` : ''}
        </div>
        <div class="gain">${a.execucao === 'nao_feito' ? '' : `<div class="g">R$ ${reais(a.ganho)}</div><div class="c">para você</div>`}</div>
      </div>`;
    if (a.execucao === 'feito') {
      html += `<div class="state"><span class="pill ok">✓ Feito · +R$ ${reais(a.ganho)}</span><button class="undo" data-desfazer="${a.linha}">Desfazer</button></div>`;
    } else if (a.execucao === 'nao_feito') {
      html += `<div class="state"><span class="pill no">Não feito</span><button class="undo" data-desfazer="${a.linha}">Desfazer</button></div>`;
    } else if (d <= dados.hoje) {
      html += `<div class="actions"><button class="b-ok" data-feito="${a.linha}">Feito</button><button class="b-no" data-nao="${a.linha}">Não feito</button></div>`;
    } else {
      html += `<div class="future">Você poderá marcar como feito no dia. · <button data-nao="${a.linha}">Cliente desmarcou?</button></div>`;
    }
    html += `</div>`;
  });

  if (futuroOuHoje && !folga) html += `<button class="folga-btn" id="marcarFolga">Quero folga neste dia</button>`;

  const main = $('#lista');
  main.innerHTML = html;
  main.querySelectorAll('[data-feito]').forEach(b => b.onclick = () => abrirFeito(acha(b.dataset.feito)));
  main.querySelectorAll('[data-nao]').forEach(b => b.onclick = () => abrirNaoFeito(acha(b.dataset.nao)));
  main.querySelectorAll('[data-desfazer]').forEach(b => b.onclick = () => desfazer(acha(b.dataset.desfazer)));
  main.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { diaSel = b.dataset.ir; desenharDias(); desenharLista(); });
  const mf = $('#marcarFolga'); if (mf) mf.onclick = abrirFolga;
  const tf = $('#tirarFolga'); if (tf) tf.onclick = tirarFolga;
}
const acha = linha => dados.atendimentos.find(a => String(a.linha) === String(linha));

/* ---------------- ações ---------------- */
async function enviar(acao, extra, aoOk) {
  ocupado = true;
  const antes = dados.ganhosSemana;
  const r = await api(acao, extra);
  ocupado = false;
  if (!r.ok) { toast(r.erro || 'Não foi possível salvar.', true); return false; }
  aplicar(r, true);
  const dif = Math.round(((r.ganhosSemana || 0) - (antes || 0)) * 100) / 100;
  if (aoOk) aoOk(dif);
  return true;
}

function abrirFeito(a) {
  const pct = Math.round(dados.comissao * 100);
  abrirFolha(`<h3>Serviço feito</h3>
    <p>${esc(a.cliente)} · ${esc(a.servico)}</p>
    <label style="font-size:14px;color:var(--soft)">Valor cobrado da cliente</label>
    <div class="field"><span>R$</span><input id="valorCheio" inputmode="decimal" value="${reais(a.valorCheio)}"></div>
    <div class="you">Você recebe (${pct}%): <b id="vcRecebe">R$ ${reais(a.ganho)}</b></div>
    <div class="btns"><button class="b-ghost" data-x>Cancelar</button><button class="b-dark" id="okFeito">Confirmar</button></div>`);
  const inp = $('#valorCheio');
  const ler = () => Number(String(inp.value).replace(/\./g, '').replace(',', '.').replace(/[^\d.]/g, '')) || 0;
  inp.oninput = () => { $('#vcRecebe').textContent = 'R$ ' + reais(ler() * dados.comissao); };
  $('#okFeito').onclick = async ev => {
    ev.target.disabled = true; ev.target.textContent = 'Salvando…';
    const ok = await enviar('marcar', { linha: a.linha, id: a.id, execucao: 'feito', valorCheio: ler() },
      dif => { if (dif > 0) toast('+ R$ ' + reais(dif)); });
    if (ok) fecharFolha(); else { ev.target.disabled = false; ev.target.textContent = 'Confirmar'; }
  };
}

function abrirNaoFeito(a) {
  const futuro = a.data > dados.hoje;
  abrirFolha(`<h3>${futuro ? 'Cliente desmarcou?' : 'Não foi feito?'}</h3>
    <p>${esc(a.cliente)} · ${hm(a.horario)}<br>${futuro || a.data === dados.hoje
      ? 'O horário volta a ficar livre no site para outra cliente agendar.'
      : 'O atendimento fica registrado como não feito e não entra nos seus ganhos.'}</p>
    <div class="btns"><button class="b-ghost" data-x>Voltar</button><button class="b-red" id="okNao">Marcar não feito</button></div>`);
  $('#okNao').onclick = async ev => {
    ev.target.disabled = true; ev.target.textContent = 'Salvando…';
    const ok = await enviar('marcar', { linha: a.linha, id: a.id, execucao: 'nao_feito' },
      () => toast(futuro || a.data === dados.hoje ? 'Horário liberado no site' : 'Marcado como não feito'));
    if (ok) fecharFolha(); else { ev.target.disabled = false; ev.target.textContent = 'Marcar não feito'; }
  };
}

function desfazer(a) {
  abrirFolha(`<h3>Desfazer?</h3><p>${esc(a.cliente)} · ${hm(a.horario)} volta para "a marcar"${a.execucao === 'feito' ? ' e o valor sai dos seus ganhos' : ' e o horário volta a ficar ocupado no site'}.</p>
    <div class="btns"><button class="b-ghost" data-x>Voltar</button><button class="b-dark" id="okDesf">Desfazer</button></div>`);
  $('#okDesf').onclick = async ev => {
    ev.target.disabled = true; ev.target.textContent = 'Salvando…';
    const ok = await enviar('marcar', { linha: a.linha, id: a.id, execucao: '' });
    if (ok) fecharFolha(); else { ev.target.disabled = false; ev.target.textContent = 'Desfazer'; }
  };
}

function abrirFolga() {
  const d = diaSel, [, m, dd] = d.split('-');
  const n = atendDo(d).filter(a => a.execucao !== 'nao_feito').length;
  abrirFolha(`<h3>Folga ${DIAS_SEM_LONGO[dow(d)].toLowerCase()}, ${Number(dd)} ${MESES[Number(m) - 1]}</h3>
    <p>O dia fica bloqueado no site e ninguém mais consegue agendar com você.${n
      ? `<br><br><b style="color:var(--no)">Atenção:</b> você já tem ${n} ${n === 1 ? 'cliente marcada' : 'clientes marcadas'} neste dia. A folga não desmarca ninguém — combine com o salão o que fazer com ${n === 1 ? 'ela' : 'elas'}.` : ''}</p>
    <div class="btns"><button class="b-ghost" data-x>Cancelar</button><button class="b-dark" id="okFolga">Marcar folga</button></div>`);
  $('#okFolga').onclick = async ev => {
    ev.target.disabled = true; ev.target.textContent = 'Salvando…';
    const ok = await enviar('folga', { data: d, marcar: true }, () => toast('Folga marcada'));
    if (ok) fecharFolha(); else { ev.target.disabled = false; ev.target.textContent = 'Marcar folga'; }
  };
}

function tirarFolga() {
  abrirFolha(`<h3>Remover folga?</h3><p>O dia volta a ficar disponível para agendamentos no site.</p>
    <div class="btns"><button class="b-ghost" data-x>Voltar</button><button class="b-dark" id="okTirar">Remover</button></div>`);
  $('#okTirar').onclick = async ev => {
    ev.target.disabled = true; ev.target.textContent = 'Salvando…';
    const ok = await enviar('folga', { data: diaSel, marcar: false }, () => toast('Folga removida'));
    if (ok) fecharFolha(); else { ev.target.disabled = false; ev.target.textContent = 'Remover'; }
  };
}

/* ---------------- folha e avisos ---------------- */
function abrirFolha(html) {
  $('#overlay').innerHTML = `<div class="scrim"><div class="sheet" role="dialog">${html}</div></div>`;
  const scrim = $('#overlay .scrim');
  scrim.addEventListener('click', e => { if (e.target === scrim || e.target.hasAttribute('data-x')) fecharFolha(); });
}
function fecharFolha() { $('#overlay').innerHTML = ''; }
function toast(msg, erro) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

/* ---------------- modo demonstração ---------------- */
let demo = null;

  return new Promise(res => setTimeout(() => res(demoResp(acao, x)), 350));
}
function demoResp(acao, x) {
  const contas = { KatiaMK: { id: 'katia', nome: 'Katia' }, SueniaMK: { id: 'suenia', nome: 'Suênia' } };
  const prof = contas[codigo];
  if (!prof) return { ok: false, erro: 'Código de acesso inválido.' };
  if (acao === 'login') return { ok: true, profissional: prof };
  if (!demo) demo = demoInicial();
  if (acao === 'marcar') {
    const a = demo.at.find(a => a.linha === x.linha);

  }
  if (acao === 'folga') {
    demo.folgas = demo.folgas.filter(f => f.data !== x.data);

  }
  const at = demo.at.map(a => ({ ...a, ganho: Math.round(a.valorCheio * 50) / 100 }));
  const ini = demo.ini, fim = somaDias(ini, 6);
  const feitos = at.filter(a => a.execucao === 'feito' && a.data >= ini && a.data <= fim);
  return { ok: true, profissional: prof, hoje: demo.hoje, inicioSemana: ini, comissao: .5, diasAbertos: [2, 3, 4, 5, 6],
    atendimentos: at, folgas: demo.folgas,
    ganhosSemana: feitos.reduce((s, a) => s + a.ganho, 0),
    ganhosHoje: feitos.filter(a => a.data === demo.hoje).reduce((s, a) => s + a.ganho, 0),
    feitosSemana: feitos.length };
}
